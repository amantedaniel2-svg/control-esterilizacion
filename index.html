<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Esterilización</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f7fb;
}

.container {
  display: flex;
}

.sidebar {
  width: 250px;
  background: #0b3d91;
  color: white;
  height: 100vh;
  padding: 20px;
}

.sidebar button {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
  background: #1e5bd7;
  border: none;
  color: white;
  cursor: pointer;
}

.main {
  flex: 1;
  padding: 20px;
}

.cards {
  display: flex;
  gap: 20px;
}

.card {
  background: white;
  padding: 20px;
  flex: 1;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.green { color: green; }
.red { color: red; }

canvas {
  margin-top: 30px;
  background: white;
  padding: 20px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

  <div class="sidebar">
    <h2>🏥 Sistema</h2>
    <button onclick="cargarDashboard()">Dashboard</button>
    <button onclick="window.location.href='/reporte'">Reporte</button>
    <button onclick="window.location.href='/excel'">Excel</button>
  </div>

  <div class="main">

    <h1>📊 Dashboard</h1>

    <div class="cards">
      <div class="card">
        <h3>Total Registros</h3>
        <h1 id="total">0</h1>
      </div>

      <div class="card">
        <h3>OPA Aceptados</h3>
        <h1 id="ok" class="green">0</h1>
      </div>

      <div class="card">
        <h3>OPA Rechazados</h3>
        <h1 id="fail" class="red">0</h1>
      </div>
    </div>

    <canvas id="grafico"></canvas>

  </div>

</div>

<script>
async function cargarDashboard() {
  const res = await fetch("/api/registros");
  const data = await res.json();

  document.getElementById("total").innerText = data.length;

  let ok = 0;
  let fail = 0;

  let tipos = {
    OPA: 0,
    ATP: 0,
    TEMPERATURA: 0,
    DUREZA: 0,
    EPP: 0
  };

  data.forEach(r => {
    if (r.estado === "ACEPTADO") ok++;
    if (r.estado === "RECHAZADO") fail++;

    if (tipos[r.tipo] !== undefined) {
      tipos[r.tipo]++;
    }
  });

  document.getElementById("ok").innerText = ok;
  document.getElementById("fail").innerText = fail;

  const ctx = document.getElementById("grafico").getContext("2d");

  new Chart(ctx, {
    type: "bar",
    data: {
      labels: Object.keys(tipos),
      datasets: [{
        label: "Registros",
        data: Object.values(tipos)
      }]
    }
  });
}

cargarDashboard();
</script>

</body>
</html>
