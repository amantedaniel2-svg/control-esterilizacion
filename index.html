<h1>Registro Control Central de Esterilización</h1>

<script>
const tecnicos = [
"ALLENDE VICTOR HUGO","AVALOS LAURA ANGELA","AVILA MARIA INES",
"BARRIONUEVO ERICA CECILIA","CARMONA FABIANA","CONDORI CHAVEZ VALERIA CLAUDIA",
"FAJARDO VALERIA","GALEAN DANIELA FERNANDA","GIUPPONI MARIA CRISTINA",
"GONZALEZ MICHELLE VERONICA","HENRIQUEZ DAINA NISELA","LEZCANO ERICA DIANA",
"LEZCANO JERONIMO EZEQUIEL","MALDONADO NATALIA SOLEDAD","MANCUSO MARINA VERONICA",
"MONTEROS MIGUEL ANGEL","POSDELEY MARTHA ELIZABETH","PAVON LAUTARO LEONEL",
"RIDDLE ALEXIS","RODRIGUEZ HORACIO FLORENCIO","RODRIGUEZ LILIANA KARINA",
"SANTOS ALFREDO ANTONIO","SAYES YANINA SUSANA","SOSA MARCELO JAVIER",
"SERRANO DANIEL FRANCISCO","SUTER LEILA YANINA VANESA","TERRAZAS KURT",
"VARELA SILVINA DANIELA","VARGAS LUIS GREGORIO"
];

function cargarTecnicos() {
  document.querySelectorAll(".tecnico").forEach(select => {
    select.innerHTML = "<option value=''>-- Seleccionar Técnico --</option>";
    tecnicos.forEach(t => {
      const op = document.createElement("option");
      op.value = t;
      op.textContent = t;
      select.appendChild(op);
    });
  });
}

window.onload = cargarTecnicos;
</script>

<!-- OPA -->
<form action="/opa" method="POST" enctype="multipart/form-data">
  <h2>OPA</h2>

  Técnico:
  <select name="tecnico" class="tecnico" required></select><br>

  PPM:
  <input type="number" step="0.01" name="ppm" required><br>

  Foto:
  <input type="file" name="foto"><br>

  <button type="submit">Guardar OPA</button>
</form>

<hr>

<!-- TEMPERATURA -->
<form action="/temperatura" method="POST">
  <h2>Temperatura / Humedad</h2>

  <select name="sector">
    <option>ENTREGA ESTERIL</option>

    <option>ACONDICIONADO CIRUGIA</option>
    <option>ACONDICIONADO GENERAL</option>
    <option>ACONDICIONADO TEXTIL</option>

  <button type="submit">Guardar</button>
</form>
