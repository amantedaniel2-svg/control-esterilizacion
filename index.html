<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control Esterilización</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 250px;
      background: #0b3d91;
      color: white;
      padding: 20px;
    }

    .sidebar h2 {
      margin-bottom: 30px;
    }

    .menu button {
      width: 100%;
      margin: 5px 0;
      padding: 12px;
      border: none;
      background: #1e5bd7;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    .menu button:hover {
      background: #163ea6;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button.submit {
      background: #0b3d91;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button.submit:hover {
      background: #082c6c;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>🏥 Esterilización</h2>

    <div class="menu">
      <button onclick="mostrar('opa')">OPA</button>
      <button onclick="mostrar('temp')">Temperatura</button>
      <button onclick="mostrar('atp')">ATP</button>
      <button onclick="mostrar('dureza')">Dureza</button>
      <button onclick="mostrar('epp')">EPP</button>

      <hr>
      <button onclick="window.location.href='/reporte'">📊 Reporte</button>
      <button onclick="window.location.href='/excel'">📥 Excel</button>
    </div>
  </div>

  <!-- CONTENIDO -->
  <div class="main">

    <!-- OPA -->
    <div id="opa" class="card">
      <h2>OPA</h2>
      <form action="/opa" method="POST" enctype="multipart/form-data">
        <input name="tecnico" placeholder="Técnico">
        <input name="ppm" placeholder="PPM">
        <input type="file" name="foto">
        <button class="submit">Guardar</button>
      </form>
    </div>

    <!-- TEMPERATURA -->
    <div id="temp" class="card" style="display:none;">
      <h2>Temperatura</h2>
      <form action="/temperatura" method="POST">
        <input name="tecnico" placeholder="Técnico">
        <input name="sector" placeholder="Sector">
        <input name="resultado" placeholder="Resultado">
        <button class="submit">Guardar</button>
      </form>
    </div>

    <!-- ATP -->
    <div id="atp" class="card" style="display:none;">
      <h2>ATP</h2>
      <form action="/atp" method="POST" enctype="multipart/form-data">
        <input name="tecnico" placeholder="Técnico">
        <input name="ubicacion" placeholder="Ubicación">
        <input name="resultado" placeholder="Resultado">
        <input type="file" name="foto">
        <button class="submit">Guardar</button>
      </form>
    </div>

    <!-- DUREZA -->
    <div id="dureza" class="card" style="display:none;">
      <h2>Dureza</h2>
      <form action="/dureza" method="POST" enctype="multipart/form-data">
        <input name="tecnico" placeholder="Técnico">
        <select name="cumple">
          <option>CUMPLE</option>
          <option>NO CUMPLE</option>
        </select>
        <input type="file" name="foto">
        <button class="submit">Guardar</button>
      </form>
    </div>

    <!-- EPP -->
    <div id="epp" class="card" style="display:none;">
      <h2>EPP</h2>
      <form action="/epp" method="POST">
        <input name="tecnico" placeholder="Técnico">
        <label><input type="checkbox" name="cofia"> Cofia</label><br>
        <label><input type="checkbox" name="guantes"> Guantes</label><br>
        <label><input type="checkbox" name="antiparras"> Antiparras</label><br>
        <label><input type="checkbox" name="delantal"> Delantal</label><br>
        <label><input type="checkbox" name="botas"> Botas</label><br>
        <button class="submit">Guardar</button>
      </form>
    </div>

  </div>
</div>

<script>
function mostrar(id) {
  document.querySelectorAll(".card").forEach(c => c.style.display = "none");
  document.getElementById(id).style.display = "block";
}
</script>

</body>
</html>
