<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Esterilización</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  height: 100vh;
  background: #1e3a5f;
  color: white;
  position: fixed;
  padding: 20px;
}

.sidebar h2 {
  margin-bottom: 30px;
}

.sidebar a {
  display: block;
  color: white;
  text-decoration: none;
  margin: 10px 0;
}

.sidebar a:hover {
  text-decoration: underline;
}

/* MAIN */
.main {
  margin-left: 240px;
  padding: 20px;
}

/* CARDS */
.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

h1 {
  color: #1e3a5f;
}

button {
  background: #1e3a5f;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #16304d;
}

input, select {
  width: 100%;
  padding: 8px;
  margin: 5px 0 10px 0;
}
</style>

</head>

<body>

<div class="sidebar">
  <h2>🏥 Esterilización</h2>
  <a href="/">Inicio</a>
  <a href="/reporte">📊 Reporte</a>
  <a href="/excel">📥 Excel</a>
</div>

<div class="main">

<h1>Control Central de Esterilización</h1>

<!-- OPA -->
<div class="card">
  <h3>OPA</h3>
  <form action="/opa" method="POST" enctype="multipart/form-data">
    Técnico:
    <input name="tecnico" required>

    PPM:
    <input type="number" step="0.01" name="ppm" required>

    Foto:
    <input type="file" name="foto">

    <button>Guardar</button>
  </form>
</div>

<!-- TEMPERATURA -->
<div class="card">
  <h3>Temperatura / Humedad</h3>
  <form action="/temperatura" method="POST">

    Técnico:
    <input name="tecnico">

    Sector:
    <select name="sector">
      <option>ENTREGA ESTERIL</option>
      <option>LAVADO</option>
      <option>CIRUGIA</option>
    </select>

    Resultado:
    <input name="resultado">

    <button>Guardar</button>
  </form>
</div>

<!-- ATP -->
<div class="card">
  <h3>ATP</h3>
  <form action="/atp" method="POST" enctype="multipart/form-data">

    Técnico:
    <input name="tecnico">

    Ubicación:
    <input name="ubicacion">

    Resultado:
    <input name="resultado">

    Foto:
    <input type="file" name="foto">

    <button>Guardar</button>
  </form>
</div>

<!-- DUREZA -->
<div class="card">
  <h3>Dureza de Agua</h3>
  <form action="/dureza" method="POST" enctype="multipart/form-data">

    Técnico:
    <input name="tecnico">

    Resultado:
    <select name="cumple">
      <option>CUMPLE</option>
      <option>NO CUMPLE</option>
    </select>

    Foto:
    <input type="file" name="foto">

    <button>Guardar</button>
  </form>
</div>

<!-- EPP -->
<div class="card">
  <h3>Control EPP</h3>
  <form action="/epp" method="POST">

    Técnico:
    <input name="tecnico">

    <label><input type="checkbox" name="cofia"> Cofia</label><br>
    <label><input type="checkbox" name="guantes"> Guantes</label><br>
    <label><input type="checkbox" name="antiparras"> Antiparras</label><br>
    <label><input type="checkbox" name="delantal"> Delantal</label><br>
    <label><input type="checkbox" name="botas"> Botas</label><br>

    <button>Guardar</button>
  </form>
</div>

</div>

</body>
</html>
